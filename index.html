<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield - Made by Kuldeep</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); flex: 1; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; font-size: 15px; }
        textarea { width: 100%; box-sizing: border-box; height: 200px; padding: 15px; border: 1px solid #bdc3c7; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; background-color: #fdfdfd; }
        button { background-color: #3498db; color: white; border: none; padding: 12px; font-size: 16px; cursor: pointer; border-radius: 8px; margin-top: 15px; width: 100%; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .result-box { display: none; margin-top: 30px; padding: 20px; border-radius: 8px; background: #fafafa; border-left: 8px solid #ccc; }
        .score { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .red-flag { color: #e74c3c; font-weight: 600; margin-bottom: 5px; }
        .safe-flag { color: #27ae60; font-weight: 600; margin-bottom: 5px; }
        .meta-info { background: #ecf0f1; padding: 10px; border-radius: 5px; margin-bottom: 15px; word-wrap: break-word; }
        footer { text-align: center; padding: 20px; margin-top: 30px; background-color: #2c3e50; color: white; border-radius: 8px; }
        footer a { color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ ScamShield</h1>
        <p class="subtitle">Paste your email raw headers below to detect spoofing and scams.</p>
        
        <!-- Form ab JavaScript se chalega -->
        <textarea id="headerInput" placeholder="Gmail se 'Show Original' copy karke yahan paste karein..." required></textarea>
        <button onclick="analyzeEmail()">Analyze Email</button>

        <div id="resultBox" class="result-box">
            <div id="scoreDiv" class="score"></div>
            <div class="meta-info">
                <p><strong>Sender:</strong> <span id="senderSpan"></span></p>
                <p><strong>Subject:</strong> <span id="subjectSpan"></span></p>
            </div>
            <h3>🚩 Red Flags:</h3>
            <ul id="redFlagsList"></ul>
            <h3>✅ Safe Indicators:</h3>
            <ul id="safeFlagsList"></ul>
        </div>
    </div>

    <footer>
        <p>Made with ❤️ by <strong>Kuldeep</strong></p>
        <p><a href="https://github.com/kuldeeplinux" target="_blank">GitHub Profile</a></p>
    </footer>

    <!-- JavaScript file link -->
    <script src="script.js"></script>
</body>
</html>
